[project]
name = "ray-dispatcher"
version = "0.1.1"
description = "Generic Ray-scheduled dispatcher for subprocess jobs on SSH-accessible VMs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "ray>=2.56,<3",
  "fabric>=3.2,<4",
  "pyyaml>=6.0,<7",
  "paramiko>=5,<6",
]

[project.urls]
Repository = "https://github.com/Nanofaas/ray-dispatcher"
Issues = "https://github.com/Nanofaas/ray-dispatcher/issues"

[project.optional-dependencies]
progress = ["rich>=13,<15"]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-pyyaml",
  "deptry>=0.23,<1",
  "twine>=6,<8",
]
e2e = [
  "multipass-vm-sdk==0.6.0 ; python_version >= '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/it"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/e2e"
markers = [
  "e2e: opt-in end-to-end tests using multipass-vm-sdk (requires Multipass)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C901"]

[tool.ruff.lint.mccabe]
# Current maximum; lower this as lifecycle functions are simplified.
max-complexity = 16

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"examples/toy_batch/tests/**" = ["S101", "S603"]
"examples/toy_batch/run_batch.py" = ["S603", "S607"]

[tool.coverage.run]
source = ["it.unimib.data.nanofaas.ray_dispatcher"]
branch = true

[tool.coverage.report]
# Unit-only coverage baseline is 81%; Ray and child-process tests run separately.
fail_under = 80
show_missing = true

[tool.deptry.per_rule_ignores]
# Preserve the legacy optional extra's installation contract.
DEP002 = ["rich"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["fabric.*", "invoke.*", "paramiko.*"]
ignore_missing_imports = true
