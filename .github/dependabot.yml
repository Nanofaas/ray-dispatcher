version: 2
updates:
  - package-ecosystem: uv
    directories:
      - /
      - /examples/toy_batch
      - /examples/toy_batch/experiment
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
