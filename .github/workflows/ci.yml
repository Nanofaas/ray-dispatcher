name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.24'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src
      - run: uv run --locked deptry src
      - run: uv run --locked pytest tests/unit -q --cov --cov-report=term-missing --cov-report=xml
      # Use the synced interpreter: uv run triggers Ray runtime-env repackaging.
      - run: .venv/bin/python -m pytest tests/integration -q
      - run: uv audit --locked --python-version '${{ matrix.python }}' --python-platform linux
      - run: uv audit --locked --project examples/toy_batch --python-version 3.13 --python-platform linux
      - if: matrix.python == '3.13'
        run: |
          uv sync --locked --group e2e
          uv run --locked --group e2e python -c 'from multipass_vm_sdk import MultipassClient, MultipassVM, find_ssh_public_key'
          uv run --locked --group e2e pytest tests/unit/test_vm_cleanup.py -q
          uv run --locked --group e2e pytest -o addopts= --collect-only tests/e2e -q
          uv sync --locked --project examples/toy_batch
          uv run --locked --project examples/toy_batch pytest examples/toy_batch/tests -q
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.24'
      - run: uv sync --locked
      - run: uv build
      - run: uv run --locked twine check --strict dist/*
      - name: Install and import the wheel outside the checkout
        run: |
          uv venv /tmp/rd-wheel
          uv pip install --python /tmp/rd-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/rd-wheel/bin/python -c 'from ray_dispatcher import Dispatcher, Job; from importlib.metadata import version; assert version("ray-dispatcher") == "0.1.1"'
